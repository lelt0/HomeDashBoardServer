[weather]
# 表示名。実際の予報地点を代表する地域名を設定してください。
region = "西宮市"
# 地域を代表する地点の緯度・経度（WGS84）。
latitude = 34.74632856233292
longitude = 135.36612336673753

# 6時間の最大降水量に応じたグリッド背景色の境界値。
# 最大降水量がこの値以下なら通常の背景色（sunny）とします。
# 0.0 の場合は「0 mm/h」を文字通り降水なしとして扱います。
no_rain_max_mm_per_hour = 0.0
# 最大降水量がこの値以下なら弱い雨用の背景色（light_rain）、超えると雨用の背景色（rain）です。
light_rain_max_mm_per_hour = 2.0

# 6時間の最大降水量に応じたグリッド背景色。
[weather.background]
sunny = "#151515"
light_rain = "#003844"
rain = "#003f7a"
