[weather]
# 表示名。実際の予報地点を代表する地域名を設定してください。
region = "神戸東部"
# 地域を代表する地点の緯度・経度（WGS84）。
latitude = 34.69
longitude = 135.19

# 6時間予報の傘判定。
# 最大降水量がこの値以下なら「降らない（☀）」とします。
# 0.0 の場合は「0 mm/h」を文字通り降水なしとして扱います。
no_rain_max_mm_per_hour = 0.0
# 最大降水量がこの値以下なら「パラパラ雨（🌂）」、超えると「雨（☂）」です。
light_rain_max_mm_per_hour = 2.0

# 天気アイコンに応じたグリッド背景色。
[weather.background]
sunny = "#151515"
cloudy = "#151515"
light_rain = "#10191b"
rain = "#0f1820"
