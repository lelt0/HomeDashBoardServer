<div class="tile__body tile__body--stack feature-interaction">
  <div class="feature-interaction__value" data-role="counter">0</div>
  <div class="feature-interaction__controls">
    <button type="button" class="button" data-action="decrement" aria-label="減らす">−</button>
    <button type="button" class="button" data-action="increment" aria-label="増やす">＋</button>
  </div>
  <label class="feature-interaction__slider-label">
    明るさ
    <input type="range" min="0" max="100" value="50" data-action="slider">
  </label>
  <div class="feature-interaction__slider-value" data-role="slider-value">50%</div>
  <a class="button button--link" href="/page/interaction">詳細ページへ</a>
</div>
