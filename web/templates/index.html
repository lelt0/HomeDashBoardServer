<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>Home Dashboard</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/features/clock/clock.css">
</head>
<body>
  <main
    class="dashboard"
    aria-label="家庭内情報表示"
    style="--dashboard-columns: {{ layout.dashboard.columns }}; --dashboard-gap: {{ layout.dashboard.gap_px }}px;"
  >
    {% for tile in layout.tiles %}
    <section
      class="tile tile--{{ tile.id }}"
      data-feature="{{ tile.feature }}"
      style="--tile-col-span: {{ tile.col_span }};"
    >
      <div class="tile__header">{{ tile.title }}</div>
      {% if tile.feature == "clock" %}
      <div class="tile__body tile__body--center feature-clock__value" data-role="value">--:--</div>
      {% else %}
      <div class="tile__body">Phase 1 / Web UI</div>
      {% endif %}
    </section>
    {% endfor %}
  </main>
  <script src="/static/features/clock/clock.js"></script>
</body>
</html>
