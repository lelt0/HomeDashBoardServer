<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Home Dashboard</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/features/display/power-save.css">
  {% for stylesheet in layout.assets.styles %}
  <link rel="stylesheet" href="{{ stylesheet }}">
  {% endfor %}
</head>
<body>
  <button
    type="button"
    class="button fullscreen-toggle"
    data-action="fullscreen"
    aria-label="全画面表示"
  >全画面</button>

  <div
    class="display-power-save"
    data-role="display-power-save"
    data-idle-timeout-seconds="{{ layout.display.idle_timeout_seconds }}"
    data-idle-message="{{ layout.display.idle_message }}"
    data-idle-marquee-speed="{{ layout.display.idle_marquee_speed_px_per_second }}"
    aria-hidden="true"
  >
    <div class="display-power-save__marquee" data-role="display-power-save-marquee"></div>
  </div>

  <main
    class="dashboard"
    aria-label="家庭内情報表示"
    style="--dashboard-columns: {{ layout.dashboard.columns }}; --dashboard-gap: {{ layout.dashboard.gap_px }}px;"
  >
    {% for tile in layout.tiles %}
    <section
      class="tile tile--{{ tile.id }}"
      data-feature="{{ tile.feature }}"
      style="--tile-col-span: {{ tile.col_span }};"
      aria-labelledby="title-{{ tile.id }}"
    >
      <div class="tile__header" id="title-{{ tile.id }}">{{ tile.title }}</div>
      {% include tile.template %}
    </section>
    {% endfor %}
  </main>

  <script src="/static/features/display/fullscreen.js"></script>
  <script src="/static/features/display/power-save.js"></script>
  {% for script in layout.assets.scripts %}
  <script src="{{ script }}"></script>
  {% endfor %}
</body>
</html>
